name: EmBeLife
options:
  bundleIdPrefix: com.embelife
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  EmBeLife:
    type: application
    platform: iOS
    sources:
      - path: EmBeLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.embelife.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: EmBeLife
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your precise location is used to show your position on the map, get directions, estimate travel times and improve search results."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access lets you scan gift QR codes to receive gift fund or services."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo library access lets you scan gift QR codes from saved images."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: EmBeLife/Info.plist
        CODE_SIGN_ENTITLEMENTS: EmBeLife/EmBeLife.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P3FZF6PS58
