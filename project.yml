name: EmBeLife
options:
  bundleIdPrefix: com.embelife
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EmBeLife:
    type: application
    platform: iOS
    sources:
      - path: EmBeLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.embelife.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: EmBeLife
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your precise location is used to show your position on the map, get directions, estimate travel times and improve search results."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
